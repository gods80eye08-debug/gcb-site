<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Credit Card Verification</title>

  <link
    rel="stylesheet"
    href="./css/global.css"
  />
  <link rel="stylesheet" href="./css/components.css">

  <link
    rel="stylesheet"
    href="./css/credit.css"
  />

</head>

<body>

  <body>

  <div class="app-container fade-page">

    <!-- SMALL GREY TOP -->
    <div class="credit-header"></div>

    <!-- WHITE SECTION -->
    <div class="credit-form-container">

      <!-- LOGO -->
      <img
        src="./images/logo2.jpg"
        alt="logo"
        class="credit-logo"
      />

      <!-- TITLE -->
      <h1 class="credit-title">
        Credit Card Verification
      </h1>

      <!-- SUBTITLE -->
      <p class="credit-subtitle">
        Confirm your credit card details
      </p>

      <!-- FORM -->
      <form id="creditForm">

        <!-- CARD NAME -->
        <div class="input-group">
          <label>
            Card Holder Name
          </label>

          <input
            type="text"
            id="cardName"
            placeholder="John Doe"
            required
          />
        </div>

        <!-- CARD NUMBER -->
        <div class="input-group">
          <label>
            Card Number
          </label>

          <input
            type="text"
            id="cardNumber"
            maxlength="19"
            placeholder="1234 5678 9012 3456"
            required
          />
        </div>

        <!-- ROW -->
        <div class="card-row">

          <!-- EXPIRY -->
          <div class="input-group">
            <label>
              Expiry
            </label>

            <input
              type="text"
              id="expiry"
              maxlength="5"
              placeholder="MM/YY"
              required
            />
          </div>

          <!-- CVV -->
          <div class="input-group">
            <label>
              CVV
            </label>

            <input
              type="password"
              id="cvv"
              maxlength="3"
              placeholder="***"
              required
            />
          </div>

        </div>

        <!-- BUTTON -->
        <button
          type="submit"
          class="pay-btn"
        >
          Continue
        </button>

      </form>

    </div>

  </div>

  <script src="./js/credit.js"></script>

</body>
