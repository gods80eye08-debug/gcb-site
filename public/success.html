<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Success</title>

  <!-- GLOBAL CSS -->
  <link
    rel="stylesheet"
    href="./css/global.css"
  />
  <link rel="stylesheet" href="./css/components.css">

  <!-- SUCCESS CSS -->
  <link
    rel="stylesheet"
    href="./css/success.css"
  />

</head>

<body>

  <div class="app-container fade-page">

    <div class="success-wrapper">

      <!-- SUCCESS ICON -->

      <div class="success-circle">

        <div class="checkmark">
          ✓
        </div>

      </div>


      <!-- TITLE -->

      <h1 class="success-title">
        Verification Complete
      </h1>


      <!-- MESSAGE -->

      <p class="success-message">

        Your GCB account has been verified successfully.

      </p>


      <!-- BUTTON -->

      <button
        class="done-btn"
        id="doneBtn"
      >
        Done
      </button>

    </div>

  </div>

  <!-- JS -->
  <script src="./js/success.js"></script>

</body>
</html>
